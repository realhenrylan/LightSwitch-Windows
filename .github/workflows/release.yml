name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 2.0.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}'
          }
          $version = $version.Trim() -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'. Expected MAJOR.MINOR.PATCH."
          }

          $match = Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'Version not found in Directory.Build.props.' }
          $declared = $match.Matches[0].Groups[1].Value
          if ($declared -ne $version) {
            throw "Directory.Build.props declares $declared but the release is $version. Bump the version before tagging."
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Releasing LightSwitch $version"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          Write-Host "Using $iscc"

      - name: Build, test, publish, and compile installer
        shell: pwsh
        run: |
          ./build.ps1 -Configuration Release -Test -Installer

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = $env:VERSION
          $publish = 'artifacts/LightSwitch-win-x64'
          $zip = "artifacts/LightSwitch-$version-portable.zip"
          if (-not (Test-Path (Join-Path $publish 'LightSwitch.exe'))) {
            throw "Publish output not found: $publish"
          }
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object FullName, Length

      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          $version = $env:VERSION
          $files = @(
            "artifacts/LightSwitch-$version-setup.exe",
            "artifacts/LightSwitch-$version-portable.zip"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name" | Out-File -FilePath "$file.sha256" -Encoding ascii
            Write-Host "$hash  $name"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LightSwitch-${{ env.VERSION }}
          path: |
            artifacts/LightSwitch-${{ env.VERSION }}-setup.exe
            artifacts/LightSwitch-${{ env.VERSION }}-setup.exe.sha256
            artifacts/LightSwitch-${{ env.VERSION }}-portable.zip
            artifacts/LightSwitch-${{ env.VERSION }}-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VERSION
          $tag = "v$version"
          $assets = @(
            "artifacts/LightSwitch-$version-setup.exe",
            "artifacts/LightSwitch-$version-setup.exe.sha256",
            "artifacts/LightSwitch-$version-portable.zip",
            "artifacts/LightSwitch-$version-portable.zip.sha256"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; uploading assets."
            gh release upload $tag @assets --clobber
          } else {
            Write-Host "Creating release $tag."
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              gh release create $tag @assets --title "LightSwitch $tag" --generate-notes
            } else {
              gh release create $tag @assets --title "LightSwitch $tag" --generate-notes --target $env:GITHUB_SHA
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release step failed with exit code $LASTEXITCODE." }
